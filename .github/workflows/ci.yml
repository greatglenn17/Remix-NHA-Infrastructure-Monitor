name: CI

on:
  pull_request:
  push:
    branches: [main]

# Android Gradle is left out on purpose: no release keystore here, and it is slow.
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test web/*.test.mjs

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools@15
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools@15
      - run: npm ci --prefix rules-tests
      - run: firebase emulators:exec --only firestore,storage,auth --project demo-nha "npm --prefix rules-tests test"

  update-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check update.json
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const text = readFileSync('update.json', 'utf8');
          const u = JSON.parse(text);
          assert.ok(Number.isInteger(u.versionCode), 'versionCode is not an integer');
          const gradle = readFileSync('app/build.gradle.kts', 'utf8');
          const code = Number(gradle.match(/versionCode\s*=\s*(\d+)/)[1]);
          const name = gradle.match(/versionName\s*=\s*"([^"]+)"/)[1];
          // The app may be ahead while a release is in flight; only the same build must carry the same name.
          if (u.versionCode === code) assert.equal(u.versionName, name, 'versionName differs from app/build.gradle.kts');
          assert.match(u.apkSha256, /^[0-9a-f]{64}$/i, 'apkSha256 is not 64 hex characters');
          // Phones read the website's copy first, then this one.
          assert.equal(readFileSync('web/update.json', 'utf8'), text, 'web/update.json differs from update.json');
          const res = await fetch(u.apkDownloadUrl, { method: 'HEAD', redirect: 'follow' });
          assert.equal(res.status, 200, `apkDownloadUrl answered ${res.status}`);
          console.log(`update.json OK: ${u.versionName} (${u.versionCode})`);
          EOF
